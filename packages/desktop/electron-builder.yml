npmRebuild: false
appId: sh.ohmypcode.desktop
productName: OhMyPCode
executableName: OhMyPCode
protocols:
  - name: OhMyPCode agent link
    schemes:
      - ohmypcode
afterPack: ./scripts/after-pack.js
afterSign: ./scripts/after-sign.js
directories:
  output: release
files:
  - dist/**/*
  - "!**/*.map"
  - "!node_modules/@getpaseo/*/src/**"
  - "!node_modules/@getpaseo/**/*.test.*"
  - "!node_modules/@getpaseo/**/*.spec.*"
  - "!node_modules/@getpaseo/server/dist/server/web-ui/**"
  # Workspace packages are symlinked, so anything a dev generates inside them
  # lands in the asar. CI never has these; a local .debug run adds gigabytes.
  - "!node_modules/@getpaseo/*/.debug/**"
  - "!node_modules/@getpaseo/*/.tasks/**"
  - "!node_modules/@getpaseo/*/conversations/**"
  - "!node_modules/@getpaseo/*/test-results/**"
asarUnpack:
  - dist/daemon/node-entrypoint-runner.js
  - node_modules/@getpaseo/server/dist/server/terminal/shell-integration/**/*
extraResources:
  - from: ../app/dist
    to: app-dist
  - from: assets/editor-targets
    to: editor-target-icons
  - from: ../../ohmypcode/default-config.json
    to: ohmypcode/default-config.json
publish:
  provider: github
  owner: hussamsoft
  repo: OhMyPCode
mac:
  artifactName: "OhMyPCode-${version}-${arch}.${ext}"
  minimumSystemVersion: "13.0.0"
  category: public.app-category.developer-tools
  icon: ../../ohmypcode/assets/desktop/icon.icns
  hardenedRuntime: true
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extraResources:
    - from: bin/paseo
      to: bin/paseo
    - from: ../../ohmypcode/assets/desktop/icon.png
      to: icon.png
    - from: ../../ohmypcode/runtime/omp/darwin-${arch}
      to: omp/darwin-${arch}
  target:
    - dmg
    - zip
linux:
  category: Development
  icon: ../../ohmypcode/assets/desktop
  artifactName: "OhMyPCode-${version}-${arch}.${ext}"
  maintainer: "OhMyPCode"
  vendor: "OhMyPCode"
  extraResources:
    - from: bin/paseo
      to: bin/paseo
    - from: ../../ohmypcode/runtime/omp/linux-${arch}
      to: omp/linux-${arch}
  target:
    - AppImage
    - deb
    - rpm
    - tar.gz
deb:
  afterInstall: scripts/linux-sandbox/after-install.tpl
rpm:
  afterInstall: scripts/linux-sandbox/after-install.tpl
appImage:
  # A nonempty argument list replaces builder's hardcoded --no-sandbox default.
  executableArgs: ["--class=OhMyPCode"]
  # Keep the AppImage filename stable across versions (no ${version}) so
  # electron-updater overwrites the file in place instead of renaming it to a new
  # versioned path. A rename orphans the old binary, breaks desktop shortcuts, and
  # dangles the ~/.local/bin/ompc CLI symlink, which points at $APPIMAGE. The
  # version stays discoverable via the release tag and the in-app version.
  artifactName: "OhMyPCode-${arch}.${ext}"
win:
  artifactName: "OhMyPCode-Setup-${version}-${arch}.${ext}"
  icon: ../../ohmypcode/assets/desktop/icon.ico
  extraResources:
    - from: bin/paseo.cmd
      to: bin/paseo.cmd
    - from: ../../ohmypcode/runtime/omp/win32-${arch}
      to: omp/win32-${arch}
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
